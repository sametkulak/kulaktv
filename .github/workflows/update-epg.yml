name: KulakTV EPG yenileme

on:
  schedule:
    # EPG'yi günde 4 kez yenile: Türkiye saatiyle yaklaşık 00:15, 06:15, 12:15, 18:15.
    # GitHub Actions cron UTC kullandığı için saatler 21:15, 03:15, 09:15, 15:15 UTC'dir.
    - cron: "15 21,3,9,15 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_epg.py"

permissions:
  contents: write

concurrency:
  group: kulaktv-data-writes
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Güncel main ile hizala
        run: git pull --rebase origin main

      - name: EPG güncelleyiciyi doğrula
        run: python -m py_compile scripts/update_epg.py

      - name: EPG'yi güncelle
        run: python scripts/update_epg.py

      - name: EPG çıktılarını doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          epg = json.loads(Path("epg.json").read_text(encoding="utf-8"))
          status = json.loads(Path("epg-status.json").read_text(encoding="utf-8"))

          if not isinstance(epg.get("channels"), dict):
              raise SystemExit("epg.json channels alanı geçersiz.")
          if not isinstance(status, dict):
              raise SystemExit("epg-status.json geçersiz.")

          print(
              f"EPG doğrulandı: {len(epg['channels'])} kanal / "
              f"{sum(len(v.get('programs', [])) for v in epg['channels'].values() if isinstance(v, dict))} program"
          )
          PY

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.json epg-status.json update-status.json update-history.json

          if git diff --cached --quiet; then
            echo "EPG'de değişiklik yok."
          else
            git commit -m "chore: EPG verisini yenile"
            git pull --rebase --autostash origin main
            git push
          fi

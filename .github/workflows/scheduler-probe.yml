name: KulakTV scheduler test

on:
  schedule:
    # TEST: 16:45 Türkiye saati = 13:45 UTC.
    # Timezone alanını bilinçli olarak kaldırıyoruz; yalnızca klasik UTC
    # cron sözdizimiyle GitHub scheduler'ı izole ediyoruz.
    - cron: "45 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler bilgisini yaz
        run: |
          echo "Scheduler çalıştı."
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

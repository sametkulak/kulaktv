name: KulakTV scheduler test

on:
  schedule:
    # TEK SEFERLİK TEST: 17:10 Türkiye saati = 14:10 UTC.
    - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler bilgisini yaz
        run: |
          echo "Scheduler çalıştı."
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

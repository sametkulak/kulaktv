name: KulakTV kanal listesini güncelle

on:
  schedule:
    # Her gün 03:15 UTC = Türkiye saatiyle 06:15
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kanal güncellemesini çalıştır
        run: python scripts/update_channels.py

      - name: Değişiklikleri kontrol et
        run: git status --short

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels.m3u update-status.json

          if git diff --cached --quiet; then
            echo "Kanal listesinde değişiklik yok."
          else
            git commit -m "chore: ByteFix kanal listesi otomatik güncelleme"
            git push
          fi

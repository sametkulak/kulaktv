name: KulakTV kanal listesini güncelle

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python ile kanal listesini güncelle
        run: python scripts/update_channels.py

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels.m3u update-status.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: otomatik kanal listesi güncellemesi"
            git push
          fi
